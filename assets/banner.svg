<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">BATON - Project Continuity Intelligence Platform</title>
  <desc id="d">A baton being passed from a leaving team member through verified claims to a successor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16264a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect x="0" y="300" width="1200" height="20" fill="url(#accent)" opacity="0.9" clip-path="url(#round)"/>
  <rect width="1200" height="320" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Title block -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="138" font-size="92" font-weight="800" letter-spacing="8" fill="#ffffff">BATON</text>
    <rect x="68" y="158" width="110" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="66" y="206" font-size="27" font-weight="600" fill="#e2e8f0">Project Continuity Intelligence Platform</text>
    <text x="66" y="248" font-size="21" font-style="italic" fill="#94a3b8">Pass the project, not just the files.</text>
  </g>

  <!-- Relay graphic -->
  <g>
    <line x1="770" y1="150" x2="940" y2="150" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="8 8"/>
    <line x1="940" y1="150" x2="1110" y2="150" stroke="#818cf8" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="8 8"/>

    <!-- Leaver -->
    <circle cx="770" cy="150" r="34" fill="#0f1b33" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="770" cy="141" r="9" fill="#38bdf8"/>
    <path d="M752 169c2-11 10-16 18-16s16 5 18 16z" fill="#38bdf8"/>

    <!-- Verified claims -->
    <circle cx="940" cy="150" r="44" fill="#0f1b33" stroke="url(#accent)" stroke-width="4"/>
    <path d="M920 151l14 14 28-30" fill="none" stroke="#4ade80" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Successor -->
    <circle cx="1110" cy="150" r="34" fill="#0f1b33" stroke="#818cf8" stroke-width="3"/>
    <circle cx="1110" cy="141" r="9" fill="#818cf8"/>
    <path d="M1092 169c2-11 10-16 18-16s16 5 18 16z" fill="#818cf8"/>

    <!-- Baton -->
    <g transform="translate(855 150) rotate(-24)">
      <rect x="-30" y="-8" width="60" height="16" rx="8" fill="#f8fafc"/>
      <rect x="-30" y="-8" width="14" height="16" rx="7" fill="#38bdf8"/>
      <rect x="16" y="-8" width="14" height="16" rx="7" fill="#818cf8"/>
    </g>
  </g>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#cbd5e1" text-anchor="middle">
    <text x="770" y="218">Leaver</text>
    <text x="940" y="218">Verified claims</text>
    <text x="1110" y="218">Successor</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
